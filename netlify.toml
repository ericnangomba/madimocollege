# ==============================================================================
# MADIMO COLLEGE OF MISSIONS - NETLIFY DEPLOYMENT CONFIGURATION
# Framework: Next.js (App Router)
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

# Official Netlify Next.js runtime plugin for App Router, API routes, and SSR
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NETLIFY_DRAWER = "false"
  NETLIFY_FEEDBACK = "false"

[context.deploy-preview.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_FEEDBACK = "false"

[context.production.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_FEEDBACK = "false"

[context.branch-deploy.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_FEEDBACK = "false"

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# High-efficiency caching for static imagery and branding assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/madimo-logo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
